<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Wonder</title><style>
*{box-sizing:border-box}body{margin:0;background:#080d21;color:#eef7ff;font-family:system-ui;overflow:hidden;touch-action:none}header{position:absolute;top:0;width:100%;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#080d21,transparent);z-index:2}h1{font-size:18px;margin:0;letter-spacing:3px;color:#8fffe4}small{color:#9caccb;font-size:11px}button{border:1px solid #4a688c;background:#19273f;color:white;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}canvas{width:100vw;height:100dvh;display:block}#hud{position:absolute;top:72px;left:18px;font-size:13px;line-height:1.7;pointer-events:none}#message{position:absolute;bottom:105px;width:100%;text-align:center;padding:0 22px;pointer-events:none;color:#fff;font-size:15px;text-shadow:0 2px 8px #000}footer{position:absolute;bottom:18px;width:100%;display:flex;gap:12px;justify-content:center;align-items:center}#card{position:absolute;inset:0;background:#081125c9;backdrop-filter:blur(12px);display:grid;place-items:center;z-index:5}article{max-width:390px;margin:20px;padding:32px;border:1px solid #52749b;border-radius:30px;background:linear-gradient(145deg,#203958,#10182d);text-align:center;box-shadow:0 20px 100px #000}article h2{font-size:34px;margin:10px 0}article p{line-height:1.7;color:#c5d6ec}.big{font-size:65px}#go{background:#8fffe4;color:#102535;width:100%;font-size:16px}#pause{padding:8px 12px}</style></head><body>
<canvas id="game"></canvas><header><div><h1>POCKET WONDER</h1><small>A LITTLE WORLD WITH BIG SECRETS</small></div><button id="pause">Pause</button></header><div id="hud"></div><div id="message"></div><footer><button id="burst">✦ Wonder pulse</button><button id="sound">Sound off</button></footer><div id="card"><article><div class="big">🎁</div><h2>The world is wrapped.</h2><p>You are a little lantern creature.<br>Open gifts. Gather three moon keys.<br>Find the door to the next strange world.</p><p><b>Drag anywhere to move</b><br>Or use arrows / WASD. Space sends a pulse.</p><button id="go">Unwrap the adventure</button></article></div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('message'),card=document.getElementById('card');let W,H,t=0,last=0,active=false,paused=false,room=0,score=0,keys=0,combo=0,shield=0,boost=0,cool=0,notice=0,mode=0,particles=[],gifts=[],gems=[],foes=[],target=null,pressed={},audio=null,sound=false,door=false,best=0;try{best=+localStorage.getItem('pocketWonderBest')||0}catch(e){}const themes=[['The Velvet Orchard','#143d4c','#72ffd3'],['Candy Comet Crossing','#482547','#ffa9d8'],['The Upside-Down Sea','#172b62','#86cfff'],['Clockwork Fireflies','#3e3529','#ffe29a'],['The Moon Wolf Garden','#282149','#c0b0ff'],['A Storm of Little Suns','#522a31','#ffbe85'],['The Door That Dreams','#184339','#a7ffad']];let p={x:0,y:0};const rand=(a,b)=>a+Math.random()*(b-a);function resize(){let ow=W||innerWidth,oh=H||innerHeight;W=innerWidth;H=innerHeight;c.width=W*Math.min(devicePixelRatio||1,2);c.height=H*Math.min(devicePixelRatio||1,2);g.setTransform(c.width/W,0,0,c.height/H,0,0);p.x=p.x? p.x/ow*W:W/2;p.y=p.y?p.y/oh*H:H*.65;for(const a of [...gifts,...gems,...foes]){a.x=a.x/ow*W;a.y=a.y/oh*H}}addEventListener('resize',resize);resize();function place(){return{x:rand(32,W-32),y:rand(155,Math.max(180,H-155))}}function say(s){msg.textContent=s;notice=5}function tone(f=450){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.connect(v);v.connect(audio.destination);o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.8,audio.currentTime+.14);v.gain.setValueAtTime(.045,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch(e){}}function sparkle(x,y,color,n=20){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-100,100),life:rand(.4,1.3),color});if(particles.length>350)particles.splice(0,particles.length-350)}function save(){best=Math.max(best,score);try{localStorage.setItem('pocketWonderBest',best)}catch(e){}}function level(){keys=0;door=false;gifts=[];gems=[];foes=[];mode=0;p.x=W/2;p.y=H*.65;for(let i=0;i<12;i++)gifts.push({...place(),kind:i<3?'key':i<8?'gem': ['rain','giant','friend','shuffle'][Math.floor(rand(0,4))],wob:rand(0,6)});for(let i=0;i<Math.min(room+1,5);i++)foes.push({...place(),a:rand(0,6)});say(themes[room][0]+' — three keys are hidden in the gifts.')}function open(a){if(!gifts.includes(a))return;gifts.splice(gifts.indexOf(a),1);score+=20;combo++;tone(300+combo*30);sparkle(a.x,a.y,themes[room][2]);if(a.kind==='key'){keys++;say(keys===3?'The moon door is awake. Step into its light!':'Moon key '+keys+' of 3!');if(keys===3)door=true}else if(a.kind==='gem'){for(let i=0;i<7;i++)gems.push({x:a.x+rand(-45,45),y:a.y+rand(-45,45),life:20});say(['A pocket full of starlight!','This gift was bigger on the inside.','Tiny stars. Excellent taste.'][Math.floor(rand(0,3))])}else if(a.kind==='rain'){for(let i=0;i<30;i++)gems.push({...place(),life:16});say('SURPRISE: a meteor shower made of treasure!')}else if(a.kind==='giant'){boost=9;shield=9;say('SURPRISE: you are enormous! Chase the shadows!')}else if(a.kind==='friend'){shield=15;mode=1;say('SURPRISE: a moon wolf is protecting you.')}else{for(const box of gifts)Object.assign(box,place());score+=100;say('SURPRISE: the orchard just rearranged itself!');sparkle(W/2,H/2,'#fff',80)}save()}function pulse(){if(!active||paused||cool>0)return;cool=4;tone(200);sparkle(p.x,p.y,'#8fffe4',45);for(const a of [...gifts])if(Math.hypot(a.x-p.x,a.y-p.y)<145)open(a);for(const f of foes)if(Math.hypot(f.x-p.x,f.y-p.y)<180){Object.assign(f,place());score+=30}say('Wonder pulse! Nearby gifts open and shadows scatter.')}document.getElementById('burst').onclick=pulse;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'Sound on':'Sound off';tone()};document.getElementById('go').onclick=()=>{room=0;score=0;combo=0;shield=0;boost=0;cool=0;particles=[];active=true;paused=false;card.style.display='none';level()};document.getElementById('pause').onclick=()=>{if(!active)return;paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';say(paused?'Paused — your little world is waiting.':'Back to the wonder.')};c.onpointerdown=e=>{if(!active)return;c.setPointerCapture(e.pointerId);target={x:e.clientX,y:e.clientY}};c.onpointermove=e=>{if(target)target={x:e.clientX,y:e.clientY}};c.onpointerup=c.onpointercancel=()=>target=null;addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();pressed[e.key.toLowerCase()]=true;if(e.key===' ')pulse()});addEventListener('keyup',e=>pressed[e.key.toLowerCase()]=false);addEventListener('blur',()=>{pressed={};target=null;if(active){paused=true;document.getElementById('pause').textContent='Resume'}});
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function update(dt){if(!active||paused)return;t+=dt;cool=Math.max(0,cool-dt);shield=Math.max(0,shield-dt);boost=Math.max(0,boost-dt);notice-=dt;if(notice<=0)msg.textContent='Drag to explore · collect three keys · enter the moon door';let dx=(pressed.d||pressed.arrowright?1:0)-(pressed.a||pressed.arrowleft?1:0),dy=(pressed.s||pressed.arrowdown?1:0)-(pressed.w||pressed.arrowup?1:0);if(target){dx=target.x-p.x;dy=target.y-p.y;let d=Math.hypot(dx,dy);if(d>3){dx/=d;dy/=d;let step=Math.min(d,dt*240);p.x+=dx*step;p.y+=dy*step}dx=dy=0}let len=Math.hypot(dx,dy)||1;p.x+=dx/len*dt*235;p.y+=dy/len*dt*235;p.x=Math.max(18,Math.min(W-18,p.x));p.y=Math.max(125,Math.min(H-100,p.y));for(const a of [...gifts])if(Math.hypot(a.x-p.x,a.y-p.y)<(boost?43:27))open(a);for(let i=gems.length-1;i>=0;i--){const a=gems[i];a.life-=dt;let d=Math.hypot(a.x-p.x,a.y-p.y);if(d<100){a.x+=(p.x-a.x)*dt*5;a.y+=(p.y-a.y)*dt*5}if(d<20){score+=10;tone(900);sparkle(a.x,a.y,'#ffdf8b',4);gems.splice(i,1);save()}else if(a.life<=0)gems.splice(i,1)}for(const f of foes){f.a+=dt;f.x+=Math.cos(f.a)*dt*35;f.y+=Math.sin(f.a*.8)*dt*35;f.x=Math.max(25,Math.min(W-25,f.x));f.y=Math.max(150,Math.min(H-140,f.y));if(Math.hypot(f.x-p.x,f.y-p.y)<27){if(shield>0){score+=30;sparkle(f.x,f.y,'#fff');Object.assign(f,place())}else{score=Math.max(0,score-30);combo=0;shield=2.5;Object.assign(f,place());say('A shadow stole 30 stardust. Keep exploring!')}}}if(door&&Math.hypot(p.x-W/2,p.y-165)<38){score+=200;save();if(room===6){active=false;card.style.display='grid';card.querySelector('.big').textContent='🌌';card.querySelector('h2').textContent='You unwrapped the universe.';card.querySelectorAll('p')[0].textContent='Seven secret worlds. '+score+' stardust. A very small creature did a very big thing.';card.querySelectorAll('p')[1].textContent='Best treasure haul: '+best;document.getElementById('go').textContent='Discover a fresh universe'}else{room++;shield=3;level()}}hud.innerHTML='WORLD '+(room+1)+' / 7 · '+themes[room][0]+'<br>✦ '+score+' stardust　⚿ '+keys+'/3　Best '+best;document.getElementById('burst').textContent=cool>0?'✦ Pulse '+cool.toFixed(1)+'s':'✦ Wonder pulse';for(let i=particles.length-1;i>=0;i--){let a=particles[i];a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.life<=0)particles.splice(i,1)}}
function draw(){let th=themes[room];g.fillStyle='#080d21';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(W/2,H*.5,20,W/2,H*.5,H*.7);bg.addColorStop(0,th[1]);bg.addColorStop(1,'#080d21');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(Math.sin(i*78.3)*.5+.5)*W,y=(Math.cos(i*32.8)*.5+.5)*H;circle(x,y,1+Math.sin(t+i)*.5,'#8da9ba')}g.strokeStyle=th[2]+'12';g.lineWidth=1;for(let y=140;y<H-90;y+=48){g.beginPath();g.ellipse(W/2,y,W*.46,16,0,0,7);g.stroke()}if(door){g.save();g.shadowColor=th[2];g.shadowBlur=30;g.strokeStyle=th[2];g.lineWidth=4;g.beginPath();g.ellipse(W/2,165,30+Math.sin(t*3)*3,39,0,0,7);g.stroke();circle(W/2,165,22,'#ffffff33');g.restore()}for(const a of gifts){let y=a.y+Math.sin(t*2+a.wob)*4;g.save();g.translate(a.x,y);g.rotate(Math.sin(t+a.wob)*.08);g.shadowColor=th[2];g.shadowBlur=12;g.fillStyle='#294e69';g.fillRect(-16,-14,32,30);g.fillStyle=th[2];g.fillRect(-19,-17,38,8);g.fillRect(-3,-17,6,33);g.strokeStyle=th[2];g.lineWidth=3;g.beginPath();g.ellipse(-6,-22,7,4,-.5,0,7);g.ellipse(6,-22,7,4,.5,0,7);g.stroke();g.restore()}for(const a of gems){g.save();g.translate(a.x,a.y);g.rotate(t);g.fillStyle='#ffe59c';g.beginPath();g.moveTo(0,-7);g.lineTo(5,0);g.lineTo(0,7);g.lineTo(-5,0);g.fill();g.restore()}for(const f of foes){circle(f.x,f.y,17,'#101022');circle(f.x-5,f.y-2,3,'#ff8cae');circle(f.x+5,f.y-2,3,'#ff8cae')}if(mode&&shield>0){g.font='32px serif';g.fillText('🐺',p.x+35*Math.cos(t),p.y+35*Math.sin(t))}g.save();g.translate(p.x,p.y);if(boost>0)g.scale(1.7,1.7);g.shadowColor=th[2];g.shadowBlur=24;circle(0,0,18,th[2]);circle(0,-4,12,'#d9fff3');circle(-5,-5,2.7,'#163341');circle(5,-5,2.7,'#163341');g.strokeStyle='#163341';g.lineWidth=2;g.beginPath();g.arc(0,-1,5,0,Math.PI);g.stroke();g.fillStyle=th[2];g.beginPath();g.moveTo(-10,11);g.lineTo(-14,25+Math.sin(t*8)*3);g.lineTo(0,18);g.lineTo(14,25-Math.sin(t*8)*3);g.lineTo(10,11);g.fill();if(shield>0){g.strokeStyle='#ffffff99';g.beginPath();g.arc(0,0,26,0,7);g.stroke()}g.restore();for(const a of particles){g.globalAlpha=Math.min(1,a.life);circle(a.x,a.y,3,a.color)}g.globalAlpha=1;if(paused){g.fillStyle='#080d2180';g.fillRect(0,120,W,H-220);g.fillStyle='white';g.textAlign='center';g.font='bold 28px system-ui';g.fillText('WORLD PAUSED',W/2,H/2);g.textAlign='left'}}function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
